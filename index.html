<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول المناوبات</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#36444F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المناوبات">
<meta name="author" content="فهد العنزي">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">:root,[data-theme="classic"]{--bg:#EEF2F8;--card:#fff;--ink:#0B1F3A;--ink2:#4A5568;--muted:#8792A6;--line:#E6EBF2;--accent:#2F6BF0;--accentFg:#fff;--soft:#F7F9FC;--sec:#EEF2F9;
 --mBg:#DCE8FB;--mFg:#0B1F3A;--eBg:#2F6BF0;--eFg:#fff;--nBg:#0B1F3A;--nFg:#fff;--oBg:#F3F5F8;--oDot:#C9D0DB;--vBg:#FFF1D6;--vFg:#8A5A00;
 --bad:#C5221F;--badBg:#FDE2E1;--ok:#1E8E3E;--cellR:9px;--cardR:22px;--barBg:rgba(238,242,248,.92);--shadow:0 10px 36px rgba(11,31,58,.08);--font:Inter,"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--uiFont:"IBM Plex Sans Arabic",Inter,system-ui,Arial,sans-serif}
[data-theme="calm"]{--bg:#F3F0E8;--card:#FFFDF8;--ink:#26332F;--ink2:#56605A;--muted:#8E948C;--line:#E8E2D5;--accent:#4F7C74;--accentFg:#fff;--soft:#F8F5EE;--sec:#EFEADF;
 --mBg:#E2EDD7;--mFg:#2E4A2C;--eBg:#8DB4AC;--eFg:#0F2E29;--nBg:#36444F;--nFg:#F3EFE6;--oBg:#F1EDE3;--oDot:#CFC6B3;--vBg:#F6E1C2;--vFg:#7A4F12;
 --bad:#B3412F;--badBg:#F7DCD3;--ok:#3F7A4A;--cellR:999px;--cardR:18px;--barBg:rgba(243,240,232,.93);--shadow:0 6px 24px rgba(54,68,79,.07);--font:"Readex Pro","IBM Plex Sans Arabic",system-ui,Arial,sans-serif;--uiFont:"Readex Pro","IBM Plex Sans Arabic",system-ui,Arial,sans-serif}
[data-theme="dark"]{--bg:#0E141B;--card:#151D26;--ink:#E6ECF3;--ink2:#B7C2D0;--muted:#8693A5;--line:#243142;--accent:#6EA0FF;--accentFg:#0E141B;--soft:#1B2531;--sec:#1C2733;
 --mBg:#2B4466;--mFg:#DCE8FB;--eBg:#3D74F0;--eFg:#fff;--nBg:#B4C2D8;--nFg:#0E141B;--oBg:#1D2732;--oDot:#3A4757;--vBg:#4A3A1E;--vFg:#F5D49A;
 --bad:#FF8A80;--badBg:#3B1E1E;--ok:#7BD88F;--cellR:9px;--cardR:22px;--barBg:rgba(14,20,27,.92);--shadow:0 10px 36px rgba(0,0,0,.35);--font:Inter,"IBM Plex Sans Arabic",system-ui,Arial,sans-serif;--uiFont:"IBM Plex Sans Arabic",Inter,system-ui,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
.ui{font-family:var(--uiFont)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- header ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--barBg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);direction:rtl}
.appbar .r1{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-inline-end:6px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--nBg);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.brand .logo i{border-radius:2px;background:var(--mBg)}.brand .logo i:nth-child(3n+2){background:var(--eBg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:3px;border-radius:12px;border:1px solid var(--line)}
.tab{border:0;background:none;color:var(--ink2);font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.ibtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;height:36px;padding:0 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ibtn.only{width:36px;padding:0;justify-content:center}
.ibtn.on,.ibtn.primary{background:var(--accent);color:var(--accentFg);border-color:var(--accent)}
.ibtn:disabled{opacity:.45;cursor:default}
.ibtn input{display:none}
.r2{display:flex;align-items:center;gap:8px;padding:0 14px 9px;flex-wrap:wrap}
.grp{display:inline-flex;align-items:center;gap:6px;padding-inline-end:8px;margin-inline-end:2px;border-inline-end:1px solid var(--line)}
.grp:last-child{border:0}
.nav{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;height:36px}
.nav button{border:0;background:none;color:var(--ink);height:34px;width:34px;cursor:pointer;display:grid;place-items:center}
.nav span{font-weight:700;font-size:13.5px;min-width:118px;text-align:center;direction:ltr}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px;height:36px}
.seg button{border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:0 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dd{position:relative}
.menu{position:absolute;top:42px;inset-inline-start:0;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px;direction:rtl}
.menu button,.menu label{width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;text-align:right;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.menu button:hover,.menu label:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.status{font-size:12px;color:var(--muted);padding:0 14px 8px;direction:rtl}
/* ---------- page ---------- */
main{padding:12px 10px 40px}
.wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - var(--barH,120px) - 24px);border-radius:var(--cardR)}
.card{background:var(--card);border-radius:var(--cardR);box-shadow:var(--shadow);padding:30px 34px 26px;margin:0 auto}
.card.sched{width:max-content;min-width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.6px;color:var(--accent)}
h1{margin:6px 0 0;font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05}
h1 span{color:var(--accent)}
h1.range{font-size:32px}
.sub{font-family:var(--uiFont);font-size:14px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:640px}
.chip{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:6px 12px 6px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip i{width:20px;height:20px;border-radius:min(var(--cellR),7px);display:grid;place-items:center}
.chip i svg.ic{width:13px;height:13px}
/* grid */
table.grid{border-collapse:separate;border-spacing:4px 5px}
.grid col.name{width:200px}
.grid th{font-size:12px;font-weight:700;padding:6px 0;background:var(--card);position:sticky;top:0;z-index:3;min-width:34px}
.grid th small{display:block;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.grid th.we,.grid th.we small{color:var(--accent)}
.grid th.today{color:var(--accentFg)}
.grid th.today .dnum{background:var(--accent);color:var(--accentFg);border-radius:8px;padding:1px 6px}
.grid th .ndot{display:block;width:5px;height:5px;border-radius:50%;background:var(--vFg);margin:3px auto 0}
.grid tr>*:first-child{position:sticky;left:0;background:var(--card);z-index:2}
.grid thead tr>*:first-child{z-index:5}
.grid td{padding:0;height:30px}
.grid.week{width:100%}.grid.week td{height:42px}.grid.week th{min-width:92px}
.who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;padding-inline-end:6px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.tag{font-size:9px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:5px;padding:1px 5px}
.p{direction:ltr;height:30px;border-radius:var(--cellR);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.2px;position:relative;min-width:30px}
.week .p{height:42px;flex-direction:column;gap:1px;font-size:12px}
.week .p small{font-size:9.5px;font-weight:500;opacity:.8}
.M{background:var(--mBg);color:var(--mFg)}.E{background:var(--eBg);color:var(--eFg)}.N{background:var(--nBg);color:var(--nFg)}
.O{background:var(--oBg)}.O::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--oDot)}
.V{background:var(--vBg);color:var(--vFg)}
.X{background:transparent;border:1.5px dashed var(--bad);color:var(--bad)}
.Z{background:transparent;color:var(--muted)}
.edit .p[data-e]{cursor:pointer}.edit .p[data-e]:hover{outline:2px solid var(--accent);outline-offset:1px}
.p.ov::before{content:"";position:absolute;top:3px;right:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.p.lk{opacity:.92}
tr.g td{padding:14px 0 3px;font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:var(--muted);position:static!important;background:none!important}
tr.g td b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
tr.g td em{font-style:normal;font-weight:600;letter-spacing:.3px;margin-left:8px}
tr.sep td{height:8px}
.cnt{height:26px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink2)}
.cnt.big{height:32px;font-size:13px;font-weight:800;color:var(--ink)}
.cnt.bad{background:var(--badBg);color:var(--bad)}
tfoot tr:last-child td{position:sticky;bottom:0;background:var(--card);z-index:2}
tfoot tr:last-child td:first-child{z-index:4}
.covlab{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.covlab i{width:10px;height:10px;border-radius:3px;display:inline-block}
.foot{display:flex;justify-content:space-between;gap:20px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.foot b{color:var(--ink)}
.notes{margin-top:14px;font-family:var(--uiFont);direction:rtl;font-size:13px;display:flex;flex-direction:column;gap:6px}
.notes div{background:var(--soft);border-radius:10px;padding:8px 12px}
.notes b{color:var(--vFg);margin-inline-end:8px}
/* day board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;direction:rtl;font-family:var(--uiFont)}
.shiftcard{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shiftcard h3{margin:0;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.shiftcard h3 .n{margin-inline-start:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.35)}
.shiftcard h3 .n.bad{background:var(--badBg);color:var(--bad)}
.shiftcard .list{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.pchip b{font-size:10.5px;color:var(--muted)}
/* panels */
.panel{max-width:1360px;margin:14px auto;background:var(--card);border-radius:var(--cardR);padding:22px 24px;box-shadow:var(--shadow);direction:rtl;font-family:var(--uiFont)}
.panel h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px}
.panel h3{margin:20px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .dot{width:10px;height:10px;border-radius:50%}
.panel p.h{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.8}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.panel input,.panel select,.modal input,.modal select,.modal textarea{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--soft);color:var(--ink);min-width:0}
.panel input[type=date],.modal input[type=date]{direction:ltr}
.panel input[type=number]{width:72px;text-align:center}
.panel input[type=time]{direction:ltr;width:110px}
.tbl{overflow-x:auto}
.panel table{width:100%;border-collapse:collapse}
.panel table.wide{min-width:980px}
.panel th{font-size:11.5px;color:var(--muted);text-align:right;padding:7px 5px;border-bottom:2px solid var(--ink);white-space:nowrap}
.panel td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
.panel td input[type=text]{width:100%}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:0;background:var(--soft);color:var(--ink);border-radius:6px;width:28px;height:18px;cursor:pointer;font-size:10px;padding:0}
.mv button:disabled{opacity:.3;cursor:default}
.del{border:0;background:var(--badBg);color:var(--bad);border-radius:8px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.del:disabled{opacity:.35;cursor:default}
.patbtn{border:0;border-radius:8px;width:34px;height:32px;cursor:pointer;background:var(--soft);color:var(--ink);display:grid;place-items:center}
.patbtn.on{background:var(--accent);color:var(--accentFg)}
tr.patrow td{background:var(--soft);padding:12px 10px}
.pat{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted)}
.mode-m{background:var(--vBg)!important;color:var(--vFg)!important}
.note{font-size:12.5px;color:var(--ink2);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.8}
.note.warn{background:var(--badBg);color:var(--bad)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.plan{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plan h4{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px}
.plan h4 .badge{margin-inline-start:auto;font-size:11px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--ink2)}
.plan h4 .badge.ok{background:var(--mBg);color:var(--mFg)}
.plan .d{font-size:12.5px;color:var(--ink2);line-height:1.8;margin:0}
.plan table th,.plan table td{text-align:center;font-size:12px;padding:5px 3px}
.plan td.l{text-align:right;font-weight:700}
.plan td.bad{color:var(--bad);font-weight:800;background:var(--badBg)}
.plan .meta{display:flex;gap:6px;flex-wrap:wrap}
.plan .meta span{font-size:11.5px;background:var(--soft);border-radius:8px;padding:3px 8px;color:var(--ink2)}
.sizes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.sizes b{background:var(--soft);border-radius:8px;padding:4px 10px}
/* dashboard & reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--soft);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;direction:ltr;text-align:right}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.hbar .nm{width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{flex:1;display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--soft);direction:ltr}
.hbar .track i{display:block;height:100%}
.hbar .v{width:30px;text-align:left;font-weight:700;direction:ltr}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;direction:ltr;padding-top:10px;position:relative}
.cols .c{flex:1;display:flex;flex-direction:column-reverse;gap:1px;min-width:6px}
.cols .c i{display:block;border-radius:3px}
.cols .c.bad{outline:1.5px solid var(--bad);outline-offset:1px;border-radius:4px}
.colx{display:flex;gap:3px;direction:ltr;font-size:9px;color:var(--muted);margin-top:4px}
.colx span{flex:1;text-align:center;min-width:6px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:20px}
.dleg{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dleg span{display:flex;align-items:center;gap:6px}
.dleg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.insights{display:flex;flex-direction:column;gap:8px}
.insights div{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.7;background:var(--soft);border-radius:12px;padding:9px 12px}
.st td,.st th{text-align:center!important}
.st td.l,.st th.l{text-align:right!important;font-weight:700}
.mini{display:flex;gap:2px;direction:ltr;flex-wrap:wrap}
.mini i{width:14px;height:14px;border-radius:4px;display:inline-block}
.monthrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.monthrow .m{width:78px;font-weight:700;direction:ltr;text-align:right}
/* leaves */
.lv{display:grid;gap:2px;direction:ltr;font-size:10px}
.lv .h{color:var(--muted);text-align:center}
.lv .nm{direction:rtl;text-align:right;font-size:12.5px;padding-inline-end:6px;white-space:nowrap;overflow:hidden}
.lv i{height:18px;border-radius:4px;background:var(--soft);display:block}
.lv i.on{background:var(--vBg)}.lv i.cf{background:var(--bad)}.lv i.we{opacity:.7}
/* modal & popover */
.modalbg{position:fixed;inset:0;background:rgba(10,15,25,.38);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:var(--shadow);direction:rtl;font-family:var(--uiFont);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start}
.modal textarea{min-height:90px;resize:vertical}
.pop{position:fixed;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:repeat(4,60px);gap:6px}
.pop .p{width:60px;cursor:pointer}
.pop .auto{grid-column:span 4;border:0;background:var(--soft);color:var(--ink);border-radius:9px;padding:8px;font:600 12px var(--uiFont);cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font:600 13px var(--uiFont);z-index:70;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}

@media print{.appbar,.panel{display:none}.wrap{max-height:none;overflow:visible}}

.credit{direction:rtl;text-align:center;font-size:12.5px;color:var(--muted);padding:6px 14px 28px}
.credit a{color:var(--accent);text-decoration:none;font-weight:600}

const addDays=(dt,n)=>new Date(dt.getTime()+n*864e5);
const lastOfMonth=dt=>new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0));
const firstOfMonth=dt=>new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),1));
const todayISO=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;};
const ymOf=iso=>iso.slice(0,7);
function dayObj(dt){return{iso:fmt(dt),d:dt.getUTCDate(),dow:dt.getUTCDay(),mo:dt.getUTCMonth(),y:dt.getUTCFullYear(),wk:Math.floor((dt-ANCHOR)/(7*864e5))};}
function rangeDays(a,b,max=800){const s=parse(a),e=parse(b);const n=Math.min(max,Math.max(1,Math.round((e-s)/864e5)+1));return [...Array(n)].map((_,i)=>dayObj(addDays(s,i)));}
const days=()=>rangeDays(S.start,S.end,62);
const isWE=dow=>dow===5||dow===6;
function fullMonth(){const s=parse(S.start),e=parse(S.end);return s.getUTCDate()===1&&fmt(lastOfMonth(s))===fmt(e);}
function setView(v,anchor){
  const a=parse(anchor||S.start); S.view=v;
  if(v==="day"){S.start=S.end=fmt(a);}
  else if(v==="week"){const s=addDays(a,-a.getUTCDay()); S.start=fmt(s); S.end=fmt(addDays(s,6));}
  else if(v==="month"){S.start=fmt(firstOfMonth(a)); S.end=fmt(lastOfMonth(a));}
}
function shiftPeriod(dir){
  const s=parse(S.start),e=parse(S.end);
  if(S.view==="month"||(S.view==="range"&&fullMonth())){const ns=new Date(Date.UTC(s.getUTCFullYear(),s.getUTCMonth()+dir,1)); S.start=fmt(ns); S.end=fmt(lastOfMonth(ns));}
  else{const n=Math.round((e-s)/864e5)+1; S.start=fmt(addDays(s,dir*n)); S.end=fmt(addDays(e,dir*n));}
  save(); render();
}
function periodTitle(){
  const s=parse(S.start),e=parse(S.end);
  if(S.view==="day"){const d=dayObj(s);return{big:`${d.d} ${MONTHS[d.mo]} <span>${d.y}</span>`,short:`${DN[d.dow].charAt(0)+DN[d.dow].slice(1).toLowerCase()} ${d.d} ${MS[d.mo]}`,range:false,file:S.start};}
  if(fullMonth()) return {big:`${MONTHS[s.getUTCMonth()]} <span>${s.getUTCFullYear()}</span>`,short:`${MONTHS[s.getUTCMonth()]} ${s.getUTCFullYear()}`,range:false,file:`${MONTHS[s.getUTCMonth()]}_${s.getUTCFullYear()}`};
  const a=`${s.getUTCDate()} ${MS[s.getUTCMonth()]}`, b=`${e.getUTCDate()} ${MS[e.getUTCMonth()]}`;
  return {big:`${a} – ${b} <span>${e.getUTCFullYear()}</span>`,short:`${a} – ${b}`,range:true,file:`${S.start}_to_${S.end}`};
}

/* ---------- tasks & shifts ---------- */
const taskBy=c=>S.tasks.find(t=>t.code===c);
const codes=()=>S.tasks.map(t=>t.code);
const shTime=g=>`${S.shifts[g].from}–${S.shifts[g].to}`;
function shiftOf(c,g){ if(!c||SPECIAL.includes(c)||c==="—") return null; const t=taskBy(c); const sh=t?t.shift:"G"; if(sh==="G") return g==="N"?"E":g; return sh; }
function cls(c,g){ if(c==="O")return"O"; if(c==="VAC")return"V"; if(c==="?")return"X"; if(c==="—"||!c)return"Z"; return shiftOf(c,g); }
const label=c=>c==="O"?"":(c==="—"?"·":c);
function groupOfTask(code,cur){ const t=taskBy(code); if(!t||t.shift==="G") return cur; return t.shift; }
function defaultTaskFor(g){ const t=S.tasks.find(x=>x.shift===g); return t?t.code:(S.tasks[0]?S.tasks[0].code:"M"); }
function req(sh,dow){const r=S.rules; if(sh==="N") return +r.nt; return isWE(dow)?+(sh==="M"?r.weM:r.weE):+(sh==="M"?r.wdM:r.wdE);}

/* ---------- cell logic ---------- */
function cycleFor(e,wk){ if(e.cycle&&e.cycle.length){const L=e.cycle.length;return e.cycle[((wk%L)+L)%L];} return null; }
function onLeave(e,iso){ return (e.leaves||[]).find(l=>l.from&&l.to&&iso>=l.from&&iso<=l.to); }
function computed(e,day){
  const k=day.iso+"|"+e.id;
  if(S.ov[k]) return [S.ov[k],"ov"];
  if(onLeave(e,day.iso)) return ["VAC",""];
  if(e.pattern&&e.pattern[DS[day.dow]]) return [e.pattern[DS[day.dow]],""];
  const c=cycleFor(e,day.wk); const offs=c?c.off:e.off;
  if((offs||[]).includes(DS[day.dow])) return ["O",""];
  return [(c&&c.shift)?c.shift:e.task,""];
}
function code(e,day){ const k=day.iso+"|"+e.id; if(S.hist[k]) return [S.hist[k],"lk"]; return computed(e,day); }
const isLocked=iso=>S.locked.includes(ymOf(iso));
function clearOv(e){ for(const d of days()) if(!isLocked(d.iso)) delete S.ov[d.iso+"|"+e.id]; }
function snapshot(e){ for(const d of days()){ const k=d.iso+"|"+e.id; if(!S.ov[k]&&!isLocked(d.iso)) S.ov[k]=computed(e,d)[0]; } }

/* ---------- archive (locking months) ---------- */
function lockMonth(ym){
  if(S.locked.includes(ym)) return;
  const s=parse(ym+"-01"); const D=rangeDays(fmt(s),fmt(lastOfMonth(s)));
  for(const e of S.emps) for(const d of D) S.hist[d.iso+"|"+e.id]=computed(e,d)[0];
  for(const e of S.emps) S.names[e.id]=e.name;
  S.locked.push(ym); S.locked.sort();
}
function unlockMonth(ym){ S.locked=S.locked.filter(x=>x!==ym); for(const k of Object.keys(S.hist)) if(k.startsWith(ym)) delete S.hist[k]; }
function autoLock(){
  const cur=ymOf(todayISO());
  if(!S.firstUse){ S.firstUse=cur; return; }
  let y=+S.firstUse.slice(0,4), m=+S.firstUse.slice(5,7); let changed=false;
  for(let g=0;g<120;g++){ const ym=`${y}-${String(m).padStart(2,"0")}`; if(ym>=cur) break; if(!S.locked.includes(ym)){ lockMonth(ym); changed=true; } m++; if(m>12){m=1;y++;} }
  if(changed) persist();
}

/* ---------- persistence ---------- */
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){return false;} }
function save(){ const ok=persist(); unpublished=true; status(ok); }
function status(ok=true){
  const sb=$("saveBtn"); if(sb){ sb.hidden=!art; sb.disabled=!unpublished; }
  let t="";
  if(tab==="sched"&&editing) t=ok?"وضع التعديل · التغييرات تُحفظ تلقائياً على هذا الجهاز · اضغط على أي خانة لتغيير يوم، وعلى التاريخ لإضافة ملاحظة":"تعذّر الحفظ التلقائي على هذا الجهاز، خذ نسخة احتياطية";
  if(tab==="sched"&&days().some(d=>isLocked(d.iso))) t=(t?t+" · ":"")+"🔒 هذه الفترة معتمدة ومؤرشفة";
  if(art&&unpublished) t=(t?t+" · ":"")+"اضغط «حفظ في الصفحة» ليظهر التعديل على أجهزتك الأخرى";
  $("status").textContent=t; $("status").hidden=!t;
}
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2800)};
const ini=s=>String(s).split(/[\s-]+/).filter(w=>w.length>1&&!/^al$/i.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()||String(s).slice(0,1)||"?";
const avStyle=g=>({M:"background:var(--mBg);color:var(--mFg)",E:"background:var(--eBg);color:var(--eFg)",N:"background:var(--nBg);color:var(--nFg)"}[g]);
const nameOf=id=>{const e=S.emps.find(x=>x.id===id);return e?e.name:(S.names[id]||id);};

let _rendering=false;
function render(){
  if(_rendering){ setTimeout(render,0); return; }
  _rendering=true;
  try{ _render(); } finally { _rendering=false; }
}
function _render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  renderR2();
  const v=$("view");
  if(tab==="sched") v.innerHTML=S.view==="day"?renderDay():renderGrid();
  else if(tab==="dash") v.innerHTML=renderDash();
  else if(tab==="reports") v.innerHTML=renderReports();
  else if(tab==="leaves") v.innerHTML=renderLeaves();
  bindView();
  renderPlans(); renderPanel(); status();
  requestAnimationFrame(()=>document.documentElement.style.setProperty("--barH",$("appbar").offsetHeight+"px"));
}

  <table class="grid ${wk?"week":""}"><colgroup><col class="name">${D.map(()=>"<col>").join("")}</colgroup>
  <thead><tr><th></th>${D.map((d,i)=>`<th class="${isWE(d.dow)?"we":""} ${d.iso===today?"today":""}" data-day="${i}"><span class="dnum">${d.d}</span><small>${wk?AR[d.dow]:DN[d.dow]}</small>${S.notes[d.iso]?'<span class="ndot"></span>':""}</th>`).join("")}</tr></thead><tbody>`;
  const cov={M:Array(n).fill(0),E:Array(n).fill(0),N:Array(n).fill(0)}; let unassigned=false;
  for(const [g,title,,,icn] of GROUPS){
    const list=S.emps.filter(e=>e.group===g); if(!list.length) continue;
    h+=`<tr class="g"><td colspan="${n+1}"><b style="background:var(--${g.toLowerCase()}Bg)"></b>${title} · ${list.length}<em>${shTime(g)}</em></td></tr>`;
    for(const e of list){
      h+=`<tr><td><div class="who" data-who="${e.id}"><div class="av" style="${avStyle(g)}">${esc(ini(e.name))}</div>${esc(e.name)}${editing&&e.mode==="manual"?'<span class="tag">يدوي</span>':""}${editing&&e.pattern?'<span class="tag">أسبوعي</span>':""}</div></td>`;
      D.forEach((d,i)=>{const [c,src]=code(e,d); const sh=shiftOf(c,g); if(sh) cov[sh][i]++; if(c==="?") unassigned=true;
        const t=wk&&taskBy(c); h+=`<td><div class="p ${cls(c,g)} ${editing&&src==="ov"?"ov":""} ${src==="lk"?"lk":""}" data-e="${e.id}" data-i="${i}">${esc(label(c))}${t&&t.label&&t.label!==c?`<small>${esc(t.label)}</small>`:""}</div></td>`;});
      h+="</tr>";
    }
  }
  h+=`</tbody><tfoot><tr class="sep"><td colspan="${n+1}"></td></tr>`;
  for(const [sh,lab] of [["M","MORNING"],["E","EVENING"],["N","NIGHT"]]) h+=`<tr><td><div class="covlab"><i class="${sh}"></i>${lab}</div></td>${D.map((d,i)=>`<td><div class="cnt${cov[sh][i]<req(sh,d.dow)?" bad":""}">${cov[sh][i]}</div></td>`).join("")}</tr>`;
  h+=`<tr><td><div class="covlab" style="color:var(--ink)">ON DUTY</div></td>${D.map((d,i)=>{const t=cov.M[i]+cov.E[i]+cov.N[i];const bad=["M","E","N"].some(s=>cov[s][i]<req(s,d.dow));return `<td><div class="cnt big${bad?" bad":""}">${t}</div></td>`}).join("")}</tr></tfoot></table>
  <div class="foot"><div>${tasksFoot()}</div><div style="white-space:nowrap">${unassigned?"<b>?</b> not assigned · ":""}<b style="color:var(--bad)">red</b> = below minimum (Sun–Thu ${S.rules.wdM}/${S.rules.wdE} · Fri–Sat ${S.rules.weM}/${S.rules.weE} · Night ${S.rules.nt})</div></div>`;

  return h+`</div></div>`;
}
function renderDay(){

  const card=(k,title,icn,time)=>{ const need=k==="O"||k==="V"||k==="X"?null:req(k,d.dow); const n=by[k].length;
    return `<div class="shiftcard"><h3 class="${k}">${ic(icn)}${title}${time?` <bdi dir="ltr" style="font-weight:500;font-size:12px;opacity:.8">${time}</bdi>`:""}<span class="n ${need!=null&&n<need?"bad":""}">${n}${need!=null?" / "+need:""}</span></h3>
     <div class="list">${by[k].map(([e,c])=>`<span class="pchip">${esc(e.name)}${!["O","VAC","M","E","N"].includes(c)?` <b>${esc(c)}</b>`:""}</span>`).join("")||'<span style="color:var(--muted);font-size:13px">لا أحد</span>'}</div></div>`; };
  let h=`<div class="wrap" id="wrapEl" style="max-height:none"><div class="card" id="card" style="max-width:1100px">${headerHTML(T,`${AR[d.dow]} · من يعمل اليوم؟`)}
  <div class="board">${card("M","الصباح","sun",shTime("M"))}${card("E","المساء","sunset",shTime("E"))}${card("N","الليل","moon",shTime("N"))}${card("O","راحة","star","")}${card("V","إجازة","leave","")}${by.X.length?card("X","غير محدد","alert",""):""}</div>`;
  if(S.notes[d.iso]) h+=`<div class="notes"><div><b>ملاحظة</b>${esc(S.notes[d.iso])}</div></div>`;
  if(editing) h+=`<p class="note" style="margin-top:14px;direction:rtl">لتعديل يوم موظف بعينه انتقل إلى عرض الأسبوع أو الشهر. <button class="ibtn" id="dayNote">${ic("note")}ملاحظة لهذا اليوم</button></p>`;
  return h+`</div></div>`;
}

/* ---------- view bindings ---------- */
function bindView(){
  document.querySelectorAll("[data-who]").forEach(el=>el.onclick=()=>{ if(editing) return; rep.id=el.dataset.who; rep.from=S.start; rep.to=S.end; tab="reports"; render(); });
  document.querySelectorAll(".grid th[data-day]").forEach(th=>th.onclick=()=>{ if(!editing) return; noteModal(days()[+th.dataset.day].iso); });
  if($("dayNote")) $("dayNote").onclick=()=>noteModal(S.start);
  if(tab==="reports") bindReports();
  if(tab==="leaves") bindLeaves();
  if(tab==="dash") bindDash();
}

/* =====================================================================
   POPOVER (cell)
   ===================================================================== */
document.addEventListener("click",ev=>{
  const pop=document.querySelector(".pop");
  const cell=ev.target.closest(".card .p[data-e]");
  if(pop&&!ev.target.closest(".pop")){pop.remove(); if(!cell) return;}
  if(!editing||!cell||tab!=="sched") return;
  const e=S.emps.find(x=>x.id===cell.dataset.e), d=days()[+cell.dataset.i]; const key=d.iso+"|"+e.id;
  if(isLocked(d.iso)){ toast("هذا الشهر معتمد. ألغِ الاعتماد من زر القفل لتعديله"); return; }
  const p=document.createElement("div"); p.className="pop";
  p.innerHTML=[...codes(),"O","VAC","?"].map(c=>`<div class="p ${cls(c,e.group)}" data-c="${esc(c)}">${esc(label(c))}</div>`).join("")+`<button class="auto">تلقائي (حسب الإعدادات)</button>`;
  document.body.appendChild(p);
  const r=cell.getBoundingClientRect();
  p.style.left=Math.min(window.innerWidth-p.offsetWidth-8,Math.max(8,r.left-100))+"px";
  p.style.top=(r.bottom+p.offsetHeight+8>window.innerHeight? Math.max(8,r.top-p.offsetHeight-6) : r.bottom+6)+"px";
  p.addEventListener("click",x=>{ const c=x.target.closest("[data-c]"), a=x.target.closest(".auto");
    if(c) S.ov[key]=c.dataset.c; else if(a) delete S.ov[key]; else return; p.remove(); save(); render(); });
});

/* =====================================================================
   MODALS: note, swap, about
   ===================================================================== */
function modal(html,onMount){
  const bg=document.createElement("div"); bg.className="modalbg"; bg.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(bg); bg.addEventListener("click",ev=>{ if(ev.target===bg) bg.remove(); });
  const close=()=>bg.remove(); onMount&&onMount(bg.querySelector(".modal"),close); return close;
}
function noteModal(iso){
  const d=dayObj(parse(iso));
  modal(`<h3>${ic("note")}ملاحظة يوم ${AR[d.dow]} ${d.d} ${ARM[d.mo]}</h3><textarea id="nt" placeholder="مثال: تدريب، اجتماع، تغطية فرع">${esc(S.notes[iso]||"")}</textarea>
   <div class="acts"><button class="ibtn primary" id="ntSave">${ic("check")}حفظ</button>${S.notes[iso]?`<button class="ibtn" id="ntDel">${ic("trash")}حذف</button>`:""}<button class="ibtn" id="ntX">إلغاء</button></div>`,(m,close)=>{
    m.querySelector("#nt").focus();
    m.querySelector("#ntSave").onclick=()=>{ const v=m.querySelector("#nt").value.trim(); if(v) S.notes[iso]=v; else delete S.notes[iso]; save(); close(); render(); };
    const dbtn=m.querySelector("#ntDel"); if(dbtn) dbtn.onclick=()=>{ delete S.notes[iso]; save(); close(); render(); };
    m.querySelector("#ntX").onclick=close; });
}
function openSwap(){
  const opts=S.emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
  modal(`<h3>${ic("swap")}تبديل مناوبة بين موظفين</h3>
   <p class="note">يتبادل الموظفان فترتيهما في الأيام المحددة. لو كان أحدهما في راحة، تنتقل الراحة للآخر.</p>
   <label class="fld">الموظف الأول<select id="sa">${opts}</select></label>
   <label class="fld">الموظف الثاني<select id="sb">${opts}</select></label>
   <div class="row"><label class="fld">من<input type="date" id="sf" value="${S.start}"></label><label class="fld">إلى<input type="date" id="st" value="${S.start}"></label></div>
   <div id="sprev" class="note"></div>
   <div class="acts"><button class="ibtn primary" id="sgo">${ic("swap")}تبديل</button><button class="ibtn" id="sx">إلغاء</button></div>`,(m,close)=>{
    const sb=m.querySelector("#sb"); if(S.emps[1]) sb.value=S.emps[1].id;
    const prev=()=>{ const a=S.emps.find(x=>x.id===m.querySelector("#sa").value), b=S.emps.find(x=>x.id===sb.value); const f=m.querySelector("#sf").value, t=m.querySelector("#st").value||f;
      if(!a||!b||!f){m.querySelector("#sprev").textContent="";return;}
      const D=rangeDays(f,t<f?f:t,62); const lk=D.some(d=>isLocked(d.iso));
      m.querySelector("#sprev").innerHTML=lk?"⚠️ بعض الأيام في شهر معتمد، ألغِ اعتماده أولاً.":D.slice(0,7).map(d=>`${d.d}/${d.mo+1}: ${esc(a.name)} <b>${esc(code(a,d)[0])}</b> ⇄ ${esc(b.name)} <b>${esc(code(b,d)[0])}</b>`).join("<br>")+(D.length>7?`<br>… و${D.length-7} أيام أخرى`:""); };
    m.querySelectorAll("select,input").forEach(x=>x.onchange=prev); prev();
    m.querySelector("#sgo").onclick=()=>{ const a=S.emps.find(x=>x.id===m.querySelector("#sa").value), b=S.emps.find(x=>x.id===sb.value);
      const f=m.querySelector("#sf").value, t=m.querySelector("#st").value||f; if(!a||!b||a===b){toast("اختر موظفين مختلفين");return;}
      const D=rangeDays(f,t<f?f:t,62); if(D.some(d=>isLocked(d.iso))){toast("ألغِ اعتماد الشهر أولاً");return;}
      for(const d of D){ const ca=code(a,d)[0], cb=code(b,d)[0]; S.ov[d.iso+"|"+a.id]=cb; S.ov[d.iso+"|"+b.id]=ca; }
      save(); close(); render(); toast(`تم التبديل بين ${a.name} و${b.name} (${D.length} ${D.length>1?"أيام":"يوم"})`); };
    m.querySelector("#sx").onclick=close; });
}

/* =====================================================================
   SETTINGS PANEL (edit mode)
   ===================================================================== */
const PRESETS=[["E",3,"N",2,"3 مساء ← 2 ليل"],["E",2,"N",3,"2 مساء ← 3 ليل"],["M",3,"E",2,"3 صباح ← 2 مساء"],["M",2,"E",3,"2 صباح ← 3 مساء"],["M",3,"N",2,"3 صباح ← 2 ليل"]];
function presetPattern(e,[a,na,b,nb]){
  const offIdx=(e.off||[]).filter(Boolean).map(d=>DS.indexOf(d)); let start=0;
  if(offIdx.length){ const last=offIdx.find(i=>!offIdx.includes((i+1)%7))??offIdx[offIdx.length-1]; start=(last+1)%7; }
  const ca=defaultTaskFor(a), cb=defaultTaskFor(b); const p={}; let n=0;
  for(let k=0;k<7;k++){ const i=(start+k)%7, d=DS[i]; if(offIdx.includes(i)){p[d]="O";continue;} p[d]=n<na?ca:(n<na+nb?cb:"O"); n++; }
  return p;
}
function renameCode(oldC,newC){
  for(const e of S.emps){ if(e.task===oldC) e.task=newC; if(e.pattern) for(const k in e.pattern) if(e.pattern[k]===oldC) e.pattern[k]=newC; if(e.cycle) e.cycle.forEach(c=>{ if(c.shift===oldC) c.shift=newC; }); }
  for(const k in S.ov) if(S.ov[k]===oldC) S.ov[k]=newC;
  for(const k in S.hist) if(S.hist[k]===oldC) S.hist[k]=newC;
}
const usage=c=>S.emps.filter(e=>e.task===c||(e.pattern&&Object.values(e.pattern).includes(c))).length;

  const w=$("panelWrap"); if(tab!=="sched"||!editing){w.innerHTML="";return;}

  let h=`<div class="panel"><h2>${ic("gear")}الإعدادات</h2>
  <h3>${ic("cal")}مدة الجدول</h3>
  <div class="row"><label class="fld">من<input type="date" id="pStart" value="${S.start}"></label><label class="fld">إلى<input type="date" id="pEnd" value="${S.end}"></label>
  ${[["7","أسبوع"],["14","أسبوعين"],["28","4 أسابيع"],["month","شهر كامل"]].map(([v,t])=>`<button class="ibtn" data-len="${v}">${t}</button>`).join("")}</div>
  <h3>${ic("alert")}الحد الأدنى للتغطية</h3>
  <div class="row">${[["wdM","الأحد–الخميس صباحاً"],["wdE","الأحد–الخميس مساءً"],["weM","الجمعة والسبت صباحاً"],["weE","الجمعة والسبت مساءً"],["nt","الليل كل يوم"]].map(([k,t])=>`<label class="fld">${t}<input type="number" min="0" data-r="${k}" value="${S.rules[k]}"></label>`).join("")}</div>
  <h3>${ic("sun")}أوقات الفترات</h3>
  <div class="row">${GROUPS.map(([g,,ar])=>`<label class="fld">${ar} من<input type="time" data-sh="${g}" data-k="from" value="${S.shifts[g].from}"></label><label class="fld">إلى<input type="time" data-sh="${g}" data-k="to" value="${S.shifts[g].to}"></label>`).join("")}</div>
  <h3>${ic("note")}المهام <button class="ibtn primary" id="addTask">${ic("plus")}مهمة جديدة</button></h3>
  <p class="h">أضف مهمة جديدة أو عدّل اسمها ووقتها أو احذفها. «حسب فترة الموظف» تعني أن لونها يتبع مجموعة الموظف (مثل ADM صباحاً أو مساءً). المهمة المستخدمة لا تُحذف قبل نقل موظفيها لمهمة أخرى.</p>
  <div class="tbl"><table><thead><tr><th>الرمز</th><th>الاسم الكامل</th><th>الفترة / اللون</th><th>المستخدمون</th><th></th></tr></thead><tbody>
  ${S.tasks.map((t,i)=>{const u=usage(t.code); return `<tr data-ti="${i}"><td><input type="text" data-tf="code" value="${esc(t.code)}" maxlength="6" dir="ltr" style="width:90px;text-transform:uppercase"></td><td><input type="text" data-tf="label" value="${esc(t.label||"")}"></td>
   <td><select data-tf="shift">${opt(["G","M","E","N"],t.shift,["حسب فترة الموظف","صباح","مساء","ليل"])}</select> <span class="p ${t.shift==="G"?"M":t.shift}" style="display:inline-flex;width:44px;height:24px;vertical-align:middle">${esc(t.code)}</span></td>
   <td>${u}</td><td><button class="del" data-tdel ${u?"disabled title=\"مستخدمة\"":""}>${ic("trash")}</button></td></tr>`;}).join("")}
  </tbody></table></div>
  <h3>${ic("users")}الموظفون</h3>
  <p class="h"><b>تلقائي:</b> أيام الموظف تتبع إعداداته؛ تغيير مهمته يغيّر كل أيام الفترة. <b>يدوي:</b> تُثبَّت أيامه الحالية وتعدّلها من الجدول. تغيير المهمة لمهمة صباح أو مساء أو ليل ينقله تلقائياً لمجموعته. <b>أسبوعي:</b> تحدد فترة كل يوم (مثل 3 مساء ثم 2 ليل). الإجازات تُدار من تبويب «الإجازات».</p>`;
  for(const [g,,ar,arF] of GROUPS){
    const list=S.emps.filter(e=>e.group===g);
    h+=`<h3><span class="dot" style="background:var(--${g.toLowerCase()}Bg)"></span>الفترة ${arF} · ${list.length} <button class="ibtn primary" data-add="${g}">${ic("plus")}إضافة موظف</button></h3>`;
    if(!list.length){h+=`<p class="h">لا يوجد موظفون في هذه الفترة.</p>`;continue;}
    h+=`<div class="tbl"><table class="wide"><thead><tr><th>ترتيب</th><th style="width:20%">الموظف</th><th>الفترة</th><th>المهمة</th><th>النمط</th><th>راحة 1</th><th>راحة 2</th><th>تناوب</th><th>أسبوعي</th><th>إجازات</th><th></th></tr></thead><tbody>`;
    list.forEach((e,i)=>{
      h+=`<tr data-id="${e.id}"><td><div class="mv"><button data-mv="-1" ${i===0?"disabled":""}>▲</button><button data-mv="1" ${i===list.length-1?"disabled":""}>▼</button></div></td>
      <td><input type="text" data-f="name" value="${esc(e.name)}"></td>
      <td><select data-f="group">${opt(GROUPS.map(x=>x[0]),e.group,GROUPS.map(x=>x[2]))}</select></td>
      <td><select data-f="task">${taskOpt(e.task)}</select></td>

      <td><select data-f="off0" ${e.pattern?"disabled":""}>${dayOpt(e.off[0])}</select></td>
      <td><select data-f="off1" ${e.pattern?"disabled":""}>${dayOpt(e.off[1])}</select></td>
      <td>${e.cycle?`<span class="tag">دوري ${e.cycle.length} أسابيع</span> <button class="ibtn" data-clrcyc style="height:26px;font-size:11px">إلغاء</button>`:'<span class="tag">—</span>'}</td>
      <td><button class="patbtn ${e.pattern?"on":""}" data-pat title="جدول أسبوعي">${ic("cal")}</button></td>
      <td><span class="tag">${(e.leaves||[]).length}</span></td>
      <td><button class="del" data-del title="حذف">${ic("trash")}</button></td></tr>`;
      if(openPat.has(e.id)){ const pv=e.pattern||{};
        h+=`<tr class="patrow" data-pid="${e.id}"><td colspan="11"><div style="font-weight:700;margin-bottom:8px">الجدول الأسبوعي لـ ${esc(e.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">· اختر فترة كل يوم أو اتركه «حسب الإعدادات»</span></div>
        <div class="pat">${DS.map((d,i)=>`<label class="fld">${AR[i]}<select data-pd="${d}">${opt(["",...codes(),"O"],pv[d]||"",["حسب الإعدادات",...codes(),"راحة"])}</select></label>`).join("")}</div>
        <div class="presets">قوالب سريعة: ${PRESETS.map((p,i)=>`<button class="ibtn" data-preset="${i}">${p[4]}</button>`).join("")}${e.pattern?`<button class="ibtn" data-clearpat style="color:var(--bad)">إلغاء الجدول الأسبوعي</button>`:""}</div></td></tr>`; }
    });
    h+=`</tbody></table></div>`;
  }
  w.innerHTML=h+`</div>`;
  // bindings
  $("pStart").onchange=ev=>{ if(!ev.target.value) return; S.view="range"; S.start=ev.target.value; if(S.end<S.start) S.end=S.start; clampEnd(); save(); render(); };
  $("pEnd").onchange=ev=>{ if(!ev.target.value) return; S.view="range"; S.end=ev.target.value<S.start?S.start:ev.target.value; clampEnd(); save(); render(); };
  w.querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{ const v=b.dataset.len; if(v==="month") setView("month"); else if(v==="7") setView("week"); else { S.view="range"; S.end=fmt(addDays(parse(S.start),+v-1)); } save(); render(); });
  w.querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{S.rules[i.dataset.r]=Math.max(0,parseInt(i.value)||0); save(); render();});
  w.querySelectorAll("[data-sh]").forEach(i=>i.onchange=()=>{ if(i.value){S.shifts[i.dataset.sh][i.dataset.k]=i.value; save(); render();} });
  $("addTask").onclick=()=>{ let n=1; while(taskBy("T"+n)) n++; S.tasks.push({code:"T"+n,label:"مهمة جديدة",shift:"G"}); save(); render(); toast("أُضيفت مهمة، عدّل رمزها واسمها"); };
  w.querySelectorAll("tr[data-ti]").forEach(tr=>{ const t=S.tasks[+tr.dataset.ti];
    tr.querySelectorAll("[data-tf]").forEach(el=>el.onchange=()=>{ const f=el.dataset.tf;
      if(f==="code"){ const v=el.value.trim().toUpperCase(); if(!v||SPECIAL.includes(v)||v==="—"){toast("رمز غير صالح");render();return;} if(v!==t.code&&taskBy(v)){toast("الرمز مستخدم لمهمة أخرى");render();return;} renameCode(t.code,v); t.code=v; }
      else if(f==="label") t.label=el.value.trim(); else t.shift=el.value; save(); render(); });
    tr.querySelector("[data-tdel]").onclick=()=>{ if(usage(t.code)) return; if(S.tasks.length<=1){toast("يجب أن تبقى مهمة واحدة على الأقل");return;} S.tasks=S.tasks.filter(x=>x!==t); save(); render(); toast("حُذفت المهمة"); }; });
  w.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.add, id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

    let idx=-1; S.emps.forEach((e,i)=>{if(e.group===g) idx=i;});
    const ne={id,name:"موظف جديد",group:g,task:defaultTaskFor(g),off,cycle:null,leaves:[],mode:"auto",pattern:null};
    if(idx<0) S.emps.push(ne); else S.emps.splice(idx+1,0,ne); S.names[id]=ne.name;
    save(); render(); toast("أُضيف موظف جديد، اكتب اسمه");
    setTimeout(()=>{const inp=document.querySelector(`tr[data-id="${id}"] input[data-f=name]`); if(inp){inp.focus(); inp.select();}},60); });
  w.querySelectorAll("tr[data-id]").forEach(tr=>{
    const e=S.emps.find(x=>x.id===tr.dataset.id);
    tr.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const dir=+b.dataset.mv, same=S.emps.map((x,i)=>[x,i]).filter(([x])=>x.group===e.group);
      const pos=same.findIndex(([x])=>x.id===e.id), other=same[pos+dir]; if(!other) return; const a=same[pos][1], c=other[1]; [S.emps[a],S.emps[c]]=[S.emps[c],S.emps[a]]; save(); render(); });
    tr.querySelectorAll("[data-f]").forEach(el=>el.addEventListener("change",()=>{
      const f=el.dataset.f, v=el.value;
      if(f==="name"){ e.name=v.trim()||"موظف"; S.names[e.id]=e.name; }
      else if(f==="group"){ const old=e.group; e.group=v; const t=taskBy(e.task); if(t&&t.shift!=="G"&&t.shift!==v) e.task=defaultTaskFor(v); if(e.mode!=="manual") clearOv(e); if(old!==v) toast(`انتقل ${e.name} إلى الفترة ${GROUPS.find(x=>x[0]===v)[3]}`); }
      else if(f==="task"){ e.task=v; const ng=groupOfTask(v,e.group); if(ng!==e.group){ e.group=ng; toast(`انتقل ${e.name} إلى الفترة ${GROUPS.find(x=>x[0]===ng)[3]}`);} if(e.mode!=="manual") clearOv(e); else toast("النمط يدوي: الأيام الحالية ثابتة"); }
      else if(f==="mode"){ e.mode=v; if(v==="manual"){ snapshot(e); toast("ثُبّتت أيام هذه الفترة"); } else { clearOv(e); toast("عاد للتلقائي"); } }
      else if(f==="off0"||f==="off1"){ e.off[f==="off0"?0:1]=v; }
      save(); render(); }));
    const cc=tr.querySelector("[data-clrcyc]"); if(cc) cc.onclick=()=>{ e.cycle=null; save(); render(); };
    tr.querySelector("[data-pat]").onclick=()=>{ openPat.has(e.id)?openPat.delete(e.id):openPat.add(e.id); renderPanel(); };
    tr.querySelector("[data-del]").onclick=()=>{ if(!confirmDel(e)) return; };
    const pr=w.querySelector(`tr.patrow[data-pid="${e.id}"]`);
    if(pr){
      pr.querySelectorAll("[data-pd]").forEach(sel=>sel.onchange=()=>{ const p=e.pattern||{}; if(sel.value) p[sel.dataset.pd]=sel.value; else delete p[sel.dataset.pd]; e.pattern=Object.keys(p).length?p:null; if(e.mode!=="manual") clearOv(e); save(); render(); });
      pr.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{ e.pattern=presetPattern(e,PRESETS[+b.dataset.preset]); if(e.mode!=="manual") clearOv(e); save(); render(); toast(`طُبّق: ${PRESETS[+b.dataset.preset][4]}`); });
      const cp=pr.querySelector("[data-clearpat]"); if(cp) cp.onclick=()=>{ e.pattern=null; if(e.mode!=="manual") clearOv(e); save(); render(); };
    }
  });
}
function confirmDel(e){
  modal(`<h3>${ic("trash")}حذف ${esc(e.name)}؟</h3><p class="note">يُحذف من الجدول الحالي، ويبقى سجله في الأشهر المعتمدة متاحاً في التقارير.</p>
   <div class="acts"><button class="ibtn" id="dy" style="color:var(--bad)">${ic("trash")}حذف</button><button class="ibtn" id="dn">إلغاء</button></div>`,(m,close)=>{
    m.querySelector("#dy").onclick=()=>{ S.names[e.id]=e.name; S.emps=S.emps.filter(x=>x.id!==e.id); for(const k of Object.keys(S.ov)) if(k.endsWith("|"+e.id)) delete S.ov[k]; save(); close(); render(); toast("حُذف الموظف"); };
    m.querySelector("#dn").onclick=close; });
  return false;
}

/* =====================================================================
   PLANS (7 alternatives)
   ===================================================================== */

  const blob=data instanceof Blob?data:new Blob([data],{type:mime}); const u=URL.createObjectURL(blob);

}

        if(c.v===""||c.v==null) return `<c r="${ref}" s="${s}"/>`; return typeof c.v==="number"?`<c r="${ref}" s="${s}"><v>${c.v}</v></c>`:`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`; }).join("")}</row>`; });
    const fr=sh.freeze?`<pane xSplit="${sh.freeze.c}" ySplit="${sh.freeze.r}" topLeftCell="${col(sh.freeze.c+1)}${sh.freeze.r+1}" activePane="bottomRight" state="frozen"/>`:"";
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0"${sh.rtl?' rightToLeft="1"':""}>${fr}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>${(sh.widths||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}${sh.restWidth?`<col min="${(sh.widths||[]).length+1}" max="${(sh.widths||[]).length+sh.restCount}" width="${sh.restWidth}" customWidth="1"/>`:""}</cols><sheetData>${rows.join("")}</sheetData><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/><pageSetup orientation="landscape" paperSize="9" fitToWidth="1" fitToHeight="0"/></worksheet>`; };

<borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thick"><color rgb="FFFFFFFF"/></left><right style="thick"><color rgb="FFFFFFFF"/></right><top style="thick"><color rgb="FFFFFFFF"/></top><bottom style="thick"><color rgb="FFFFFFFF"/></bottom><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FFD5DCE8"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="18">
${xf(0,0,2,AL)}${xf(1,0,2,AL)}${xf(3,2,1,A)}${xf(2,3,1,A)}${xf(2,4,1,A)}${xf(4,5,1,A)}${xf(5,6,1,A)}${xf(9,0,0,A)}${xf(6,0,0,'<alignment vertical="center"/>')}${xf(7,0,0)}${xf(1,9,1,A)}${xf(8,9,1,A)}${xf(8,0,0,AL)}${xf(10,7,1,A)}${xf(1,8,1,A)}${xf(0,0,2,A)}${xf(7,0,1,A)}${xf(7,0,0,A)}
</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

function zipStore(files){
  const enc=new TextEncoder(), T=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[i]=c>>>0;}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
  const parts=[],cent=[]; let off=0;
  for(const [name,txt] of Object.entries(files)){
    const nb=enc.encode(name), db=enc.encode(txt), c=crc(db);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,c,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cent.push(new Uint8Array(ch.buffer),nb); off+=30+nb.length+db.length;
  }
  const cs=cent.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22)), N=Object.keys(files).length;
  e.setUint32(0,0x06054b50,true);e.setUint16(8,N,true);e.setUint16(10,N,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  const all=[...parts,...cent,new Uint8Array(e.buffer)], out=new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let p=0; for(const a of all){out.set(a,p);p+=a.length;} return out;
}
function buildScheduleXlsx(){
  const D=days(), n=D.length, T=periodTitle(); const rows=[], hts=[];
  const push=(r,h)=>{rows.push(r);hts.push(h||null);};
  push([{v:"ATM HELP DESK · SHIFT SCHEDULE",s:"group"}],20);
  push([{v:T.short+(T.range?" "+D[n-1].y:""),s:"title"}],34);
  push([{v:`جدول المناوبات · ${n} يوم`,s:"sub"}]); push([]);
  push([{v:"",s:"txt"},...D.map(d=>({v:d.d,s:isWE(d.dow)?"headWE":"head"}))],18);
  push([{v:"",s:"txt"},...D.map(d=>({v:DN[d.dow],s:"small"}))],13);
  const cov={M:Array(n).fill(0),E:Array(n).fill(0),N:Array(n).fill(0)};
  for(const [g,title] of GROUPS){ const list=S.emps.filter(e=>e.group===g); if(!list.length) continue;
    push([{v:`${title} · ${list.length} · ${shTime(g)}`,s:"group"}],22);
    for(const e of list) push([{v:e.name,s:"name"},...D.map((d,i)=>{const [c]=code(e,d); const sh=shiftOf(c,g); if(sh) cov[sh][i]++; return {v:c==="O"?"•":c,s:cls(c,g)};})],22); }
  push([]);
  for(const [sh,lab] of [["M","MORNING"],["E","EVENING"],["N","NIGHT"]]) push([{v:lab,s:"group"},...D.map((d,i)=>({v:cov[sh][i],s:cov[sh][i]<req(sh,d.dow)?"bad":"cnt"}))],18);
  push([{v:"ON DUTY",s:"group"},...D.map((d,i)=>({v:cov.M[i]+cov.E[i]+cov.N[i],s:["M","E","N"].some(s=>cov[s][i]<req(s,d.dow))?"bad":"cnt"}))],24);
  push([]); push([{v:S.tasks.map(t=>t.code+(t.label&&t.label!==t.code?" "+t.label:"")).join(" · "),s:"sub"}]);
  const notes=D.filter(d=>S.notes[d.iso]); notes.forEach(d=>push([{v:`${d.d}/${d.mo+1}: ${S.notes[d.iso]}`,s:"sub"}]));
  return xlsxBuild([{name:T.range?"Schedule":`${MS[D[0].mo]} ${D[0].y}`,rows,heights:hts,widths:[24],restWidth:6,restCount:n,freeze:{r:6,c:1}}]);
}
